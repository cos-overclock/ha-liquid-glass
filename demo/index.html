<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass Cards — demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
      }
      body {
        background: #f4d9ea;
        transition: background 0.4s ease;
      }
      body.dark {
        background: #16162a;
      }
      .bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.95;
      }
      .b1 { width: 520px; height: 520px; left: -140px; top: -120px; background: #ff9f5a; }
      .b2 { width: 560px; height: 560px; right: -160px; top: 120px; background: #ff7aa8; }
      .b3 { width: 620px; height: 620px; left: 20%; bottom: -260px; background: #6da8ff; }
      .b4 { width: 420px; height: 420px; right: 20%; bottom: 10%; background: #ffd08a; }
      .b5 { width: 380px; height: 380px; left: 45%; top: 20%; background: #c9a5ff; }
      body.dark .b1 { background: #6a3ad9; }
      body.dark .b2 { background: #c2552f; }
      body.dark .b3 { background: #1f8a99; }
      body.dark .b4 { background: #2b2f7a; }
      body.dark .b5 { background: #7a2f6a; }
      .bar {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px 24px;
        color: #1c1c1e;
        font-size: 13px;
      }
      body.dark .bar { color: #fff; }
      .bar button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.6);
        background: rgba(255,255,255,0.5);
        cursor: pointer;
      }
      body.dark .bar button { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }
      main {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(auto-fill, var(--w, 380px));
        gap: 32px;
        justify-content: center;
        padding: 12px 24px 80px;
        align-items: start;
      }
      .col { display: flex; flex-direction: column; gap: 24px; }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div>

      <button id="refr">Toggle refraction</button>
      <button id="lang">Toggle language</button>
      <label>Width <input id="w" type="range" min="170" max="440" step="10" value="380" /> <span id="wv">380</span>px</label>

      // ---- ha-icon shim (Home Assistant provides this element in production) ----
      const iconCache = new Map();
      class HaIcon extends HTMLElement {
        static get observedAttributes() { return ["icon"]; }
        set icon(v) { this._icon = v; this.draw(); }
        get icon() { return this._icon; }
        attributeChangedCallback(_, __, v) { this.icon = v; }
        connectedCallback() { this.draw(); }
        async draw() {
          if (!this.isConnected || !this._icon) return;
          const name = this._icon.replace(/^mdi:/, "");
          this.style.cssText = "display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);";
          let p = iconCache.get(name);
          if (!p) {
            p = fetch(`https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/${name}.svg`).then((r) => (r.ok ? r.text() : "")).catch(() => "");
            iconCache.set(name, p);
          }
          const svgText = await p;
          if (this._icon !== `mdi:${name}`) return;
          const m = /<path[^>]*d="([^"]+)"/.exec(svgText);
          this.innerHTML = m
            ? `<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="${m[1]}"/></svg>`
            : `<svg viewBox="0 0 24 24" width="100%" height="100%"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
        }
      }
      customElements.define("ha-icon", HaIcon);

      function history() {
        const now = Date.now();
        const pts = [];
        for (let i = 0; i <= 48; i++) {
          const t = now - (48 - i) * 30 * 60000;
          const v = 22 + Math.sin(i / 9) * 1.4 + (i > 30 ? 0.6 : 0) + (i % 7) * 0.05;
          pts.push({ state: v.toFixed(2), last_changed: new Date(t).toISOString() });
        }
        return [pts];
      }

      const params = new URLSearchParams(location.search);
      const startDark = params.get("theme") === "dark";
      document.body.classList.toggle("dark", startDark);
      // ---- mock forecasts for the weather card ----
      const CONDS = ["partlycloudy", "sunny", "sunny", "partlycloudy", "rainy", "rainy"];
      const forecast = (type) => {
        const now = Date.now();
        if (type === "hourly") {
          return [24, 26, 25, 23, 21, 20].map((t, i) => ({
            datetime: new Date(now + i * 3600e3).toISOString(),
            condition: CONDS[i],
            temperature: t,
            precipitation_probability: i > 3 ? 60 : 20,
          }));
        }
        return [
          { condition: "sunny", temperature: 27, templow: 18 },
          { condition: "rainy", temperature: 23, templow: 17 },
          { condition: "cloudy", temperature: 22, templow: 16 },
          { condition: "partlycloudy", temperature: 26, templow: 18 },
        ].map((d, i) => ({ ...d, datetime: new Date(now + i * 86400e3).toISOString(), precipitation_probability: 20 }));
      };

      const hass = {
        states,
        language: params.get("lang") ?? "ja",
        locale: { language: params.get("lang") ?? "ja" },
        themes: { darkMode: startDark },
        async callService(domain, service, data, target, notify, returnResponse) {
          document.getElementById("log").textContent = `${domain}.${service} ${JSON.stringify(data)}`;
          if (domain === "weather" && service === "get_forecasts") {
            const id = target?.entity_id;
            return { response: { [id]: { forecast: forecast(data.type) } } };
          }
          console.log("callService", domain, service, data);
          // Minimal optimistic state updates for the demo
          const id = data?.entity_id;
          const e = states[id];
          if (!e) return;
          const next = { ...e, attributes: { ...e.attributes } };
          if (service === "toggle") next.state = e.state === "on" ? "off" : "on";
          if (service === "turn_on") { next.state = "on"; if (data.brightness_pct != null) next.attributes.brightness = Math.round(data.brightness_pct * 2.55); if (data.color_temp_kelvin) { next.attributes.color_temp_kelvin = data.color_temp_kelvin; next.attributes.color_mode = "color_temp"; } if (data.hs_color) { next.attributes.hs_color = data.hs_color; next.attributes.color_mode = "hs"; delete next.attributes.rgb_color; } if (data.rgb_color) { next.attributes.rgb_color = data.rgb_color; next.attributes.color_mode = "hs"; delete next.attributes.hs_color; } }
          if (service === "set_temperature") Object.assign(next.attributes, data.temperature != null ? { temperature: data.temperature } : { target_temp_low: data.target_temp_low, target_temp_high: data.target_temp_high });
          if (service === "set_hvac_mode") next.state = data.hvac_mode;
          if (service === "set_fan_mode") next.attributes.fan_mode = data.fan_mode;
          if (service === "set_preset_mode") next.attributes.preset_mode = data.preset_mode;
          if (service === "lock") next.state = "locked";
          if (service === "unlock") next.state = "unlocked";
          if (service === "set_cover_position") { next.attributes.current_position = data.position; next.state = data.position === 0 ? "closed" : "open"; }
          if (service === "set_cover_tilt_position") next.attributes.current_tilt_position = data.tilt_position;
          if (service === "open_cover") next.state = "opening";
          if (service === "close_cover") next.state = "closing";
          if (service === "stop_cover") next.state = next.attributes.current_position === 0 ? "closed" : "open";
          if (service === "media_play_pause") next.state = e.state === "playing" ? "paused" : "playing";
          if (service === "volume_set") next.attributes.volume_level = data.volume_level;
          if (service === "shuffle_set") next.attributes.shuffle = data.shuffle;
          if (service === "repeat_set") next.attributes.repeat = data.repeat;
          if (service === "media_seek") { next.attributes.media_position = data.seek_position; next.attributes.media_position_updated_at = new Date().toISOString(); }
          if (service === "set_percentage") { next.attributes.percentage = data.percentage; next.state = data.percentage > 0 ? "on" : "off"; }
          if (service === "set_value") next.state = String(data.value);
          if (service === "select_option") next.state = data.option;
          next.last_changed = new Date().toISOString();
          states[id] = next;
          push();
        },
        async callService_forecast(type) { return forecast(type); },
        async callApi(method, path) {
          if (path.startsWith("history/period")) return history();
          return null;
        },
      };

      const cards = [
        ["liquid-glass-light-card", { entity: "light.living_room", presets: [{ name: "読書", icon: "mdi:book-open-variant", brightness: 100, color_temp_kelvin: 4500 }, { name: "リラックス", icon: "mdi:coffee", brightness: 45, color_temp_kelvin: 2700 }, { name: "おやすみ", icon: "mdi:weather-night", brightness: 10, color_temp_kelvin: 2200 }] }],

        ["liquid-glass-climate-card", { entity: "climate.living_room" }],

        ["liquid-glass-cover-card", { entity: "cover.bedroom_curtain" }],
        ["liquid-glass-cover-card", { entity: "cover.study_curtain", curtain: "single" }],
        ["liquid-glass-media-card", { entity: "media_player.living" }],
        ["liquid-glass-media-card", { entity: "media_player.paused" }],
        ["liquid-glass-media-card", { entity: "media_player.idle" }],
        ["liquid-glass-slider-card", { entity: "fan.bedroom" }],
        ["liquid-glass-slider-card", { entity: "fan.bedroom", ticks: true }],
        ["liquid-glass-slider-card", { entity: "input_number.hot_water", accent: "#FF9F0A", icon: "mdi:waves" }],
        ["liquid-glass-slider-card", { entity: "fan.bedroom_off" }],
        ["liquid-glass-select-card", { entity: "select.fan_mode" }],
        ["liquid-glass-select-card", { entity: "input_select.cleaning_mode", style: "chips", accent: "#0A84FF" }],
        ["liquid-glass-weather-card", { entity: "weather.tokyo" }],
        ["liquid-glass-weather-card", { entity: "weather.tokyo", show_daily: false, show_metrics: false }],
        ["liquid-glass-weather-card", { entity: "weather.tokyo", layout: "row" }],
        ["liquid-glass-button-card", { entity: "scene.night" }],
        ["liquid-glass-button-card", { entity: "script.vent", accent: "#5E5CE6" }],
        ["liquid-glass-scene-card", { title: "シーン", scenes: [
          { entity: "scene.morning", icon: "mdi:weather-sunset-up" },
          { entity: "scene.night", icon: "mdi:weather-night" },
          { entity: "scene.movie", icon: "mdi:movie-open" },
          { entity: "scene.away", icon: "mdi:door-open" },
          { entity: "scene.home", icon: "mdi:home" },
          { entity: "scene.focus", icon: "mdi:target" },
        ] }],
        ["liquid-glass-scene-card", { title: "シーン", show_count: true, style: "chips", scenes: [
          { entity: "scene.morning" }, { entity: "scene.night" }, { entity: "scene.movie" },
          { entity: "scene.away" }, { entity: "scene.home" }, { entity: "scene.focus", name: "集中モード" },
        ] }],
        ["liquid-glass-scene-card", { title: "クイックシーン", style: "chips", columns: 4, scenes: [
          { entity: "scene.morning" }, { entity: "scene.night" }, { entity: "scene.away" }, { entity: "scene.home" },
        ] }],
        ["liquid-glass-camera-card", { entity: "camera.front_door", motion_entity: "binary_sensor.drive_motion" }],
        ["liquid-glass-camera-card", { entity: "camera.front_door", show_actions: false }],
        ["liquid-glass-camera-card", { entity: "camera.offline" }],
        ["liquid-glass-group-card", { title: "セキュリティ", icon: "mdi:shield-home", cards: [
          { type: "custom:liquid-glass-lock-card", entity: "lock.front_door" },
          { type: "custom:liquid-glass-binary-sensor-card", entity: "binary_sensor.front_door_closed" },
          { type: "custom:liquid-glass-switch-card", entity: "switch.desk" },
        ] }],
        ["liquid-glass-group-card", { title: "セキュリティ", icon: "mdi:shield-home", collapsed: true, cards: [
          { type: "custom:liquid-glass-lock-card", entity: "lock.front_door" },
          { type: "custom:liquid-glass-binary-sensor-card", entity: "binary_sensor.front_door_closed" },
          { type: "custom:liquid-glass-switch-card", entity: "switch.desk" },
        ] }],
        ["liquid-glass-group-card", { title: "リビング", icon: "mdi:sofa", collapsed: true, cards: [
          { type: "custom:liquid-glass-light-card", entity: "light.living_room" },
          { type: "custom:liquid-glass-cover-card", entity: "cover.living_blind" },
          { type: "custom:liquid-glass-climate-card", entity: "climate.living_room" },
          { type: "custom:liquid-glass-media-card", entity: "media_player.living" },
          { type: "custom:liquid-glass-switch-card", entity: "switch.desk_off" },
        ] }],
        ["liquid-glass-separator-card", { title: "照明", icon: "mdi:lightbulb-outline", style: "plain", count: 4 }],
        ["liquid-glass-separator-card", { title: "照明", icon: "mdi:lightbulb-outline", style: "pill", count: 4 }],
        ["liquid-glass-separator-card", { title: "照明", icon: "mdi:lightbulb-outline", style: "header", subtitle: "4台 · 2台が点灯中" }],
      ];
      // ?focus=<name> narrows the page to liquid-glass-<name>-card.
      const focus = params.get("focus");
      const visibleCards = focus === "climate-a"
        ? cards.filter(([type, cfg]) => type === "liquid-glass-climate-card" && cfg.design === "compact")
        : focus
          ? cards.filter(([type]) => type === `liquid-glass-${focus}-card`)
          : cards;

      const main = document.getElementById("main");
      const els = [];
      const initialRefraction = params.get("refraction");
      let refraction = initialRefraction === "off" ? false : initialRefraction === "on" ? true : "auto";
      const initialQuality = params.get("quality");
      const refractionQuality = initialQuality === "high" || initialQuality === "medium"
        ? initialQuality
        : "auto";
      function mount() {
        main.innerHTML = "";
        els.length = 0;
        for (const [type, cfg] of visibleCards) {
          const el = document.createElement(type);
          if (type === "liquid-glass-climate-card" && cfg.design === "compact") el.id = "demo-climate-compact";
          el.setConfig({ ...cfg, refraction, refraction_quality: refractionQuality });
          el.hass = hass;
          main.appendChild(el);
          els.push(el);
        }
      }
      function push() {
        const snapshot = { ...hass, states: { ...states } };
        for (const el of els) el.hass = snapshot;
      }
      mount();

      document.getElementById("theme").onclick = () => {
        hass.themes = { darkMode: !hass.themes.darkMode };
        document.body.classList.toggle("dark", hass.themes.darkMode);
        push();
      };
      document.getElementById("refr").onclick = () => {
        refraction = refraction === false ? "auto" : false;
        mount();
      };
      document.getElementById("lang").onclick = () => {
        hass.language = hass.language === "ja" ? "en" : "ja";
        hass.locale = { language: hass.language };
        push();
      };
      const widthInput = document.getElementById("w");
      const setWidth = (px) => {
        main.style.setProperty("--w", `${px}px`);
        document.getElementById("wv").textContent = px;
        widthInput.value = px;
      };
      widthInput.oninput = () => setWidth(Number(widthInput.value));
      setWidth(Number(params.get("width") ?? 380));

      document.addEventListener("hass-more-info", (e) => (document.getElementById("log").textContent = `more-info: ${e.detail.entityId}`));
    </script>
  </body>
</html>
