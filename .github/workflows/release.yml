name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'cos-overclock/ha-liquid-glass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci

      - name: Validate source
        if: steps.existing.outputs.exists != 'true'
        run: npm run check

      - name: Build release asset
        if: steps.existing.outputs.exists != 'true'
        run: npm run build

      - name: Verify package, lockfile, bundle, and tag versions
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: npm run verify-version -- "$TAG"

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          dist/liquid-glass-cards.js
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$TAG"
          --generate-notes
          --latest
